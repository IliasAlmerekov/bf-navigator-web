<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="110" fill="#0000DB"/>
  <!-- Head -->
  <circle cx="256" cy="100" r="52" fill="#FFFFFF"/>
  <!-- Body + left leg -->
  <path d="M200 170 Q200 240 200 280 L160 370" stroke="#FFFFFF" stroke-width="38" stroke-linecap="round" fill="none"/>
  <!-- Arm -->
  <path d="M200 220 L310 240" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" fill="none"/>
  <!-- Wheelchair seat + right leg -->
  <path d="M160 280 Q160 300 180 300 L310 300 Q330 300 340 320 L360 380" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Back wheel -->
  <circle cx="200" cy="390" r="58" stroke="#FFFFFF" stroke-width="30" fill="none"/>
  <!-- Front wheel -->
  <circle cx="360" cy="400" r="34" stroke="#FFFFFF" stroke-width="26" fill="none"/>
  <!-- Route dots (top right) -->
  <circle cx="380" cy="130" r="18" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="430" cy="130" r="14" fill="#FFFFFF" opacity="0.55"/>
  <circle cx="472" cy="130" r="10" fill="#FFFFFF" opacity="0.3"/>
</svg>
